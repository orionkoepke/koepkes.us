<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #222;
        }

        .links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-decoration: none;
            color: #333;
            min-width: 300px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 1.5rem;
        }

        .link-card:hover {
            transform: translateY(-5px);
        }

        .link-card .content {
            text-align: left;
        }

        .link-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #007bff;
        }

        .link-card p {
            color: #666;
            font-size: 0.9rem;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .links {
                gap: 1rem;
            }

            .link-card {
                min-width: 0;
                width: 100%;
                padding: 1rem;
            }

            .profile-pic {
                width: 60px;
                height: 60px;
            }

            .link-card h2 {
                font-size: 1.2rem;
                margin-bottom: 0.5rem;
            }

            .link-card p {
                font-size: 0.8rem;
            }
        }

        /* Animation styles */
        .heading-container {
            height: 2.5rem;
            margin-bottom: 4rem;
            position: relative;
        }

        .heading {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }

        .heading.active {
            opacity: 1;
            transform: translateY(0);
        }

        .heading.inactive {
            opacity: 0;
            transform: translateY(-20px);
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .heading-container {
                height: 5rem;
                margin-bottom: 5rem;
            }

            .heading {
                font-size: 2rem;
                line-height: 1.2;
            }

            .container {
                padding-top: 1rem;
            }
        }
    </style>
    <script>
        // Get the subdomain from the hostname
        const subdomain = window.location.hostname.split('.')[0];
        
        // Map of valid subdomains to their paths
        const redirects = {
            'orion': '/orion',
            'nicole': '/nicole'
        };
        
        // If we have a matching subdomain, redirect to its path
        if (redirects[subdomain]) {
            window.location.href = redirects[subdomain];
        }

        // Updated heading animation
        window.addEventListener('DOMContentLoaded', () => {
            const orionHeading = document.getElementById('orion-heading');
            const nicoleHeading = document.getElementById('nicole-heading');
            const finalHeading = document.getElementById('final-heading');
            
            // Show Orion's heading
            orionHeading.classList.add('active');
            
            // After 2 seconds, switch to Nicole's heading
            setTimeout(() => {
                orionHeading.classList.remove('active');
                orionHeading.classList.add('inactive');
                nicoleHeading.classList.add('active');
            }, 2000);

            // After another 2 seconds, switch to final heading
            setTimeout(() => {
                nicoleHeading.classList.remove('active');
                nicoleHeading.classList.add('inactive');
                finalHeading.classList.add('active');
            }, 4000);
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="heading-container">
            <h1 id="orion-heading" class="heading">I'm Orion Koepke</h1>
            <h1 id="nicole-heading" class="heading">I'm Nicole Koepke</h1>
            <h1 id="final-heading" class="heading">We are The Koepkes</h1>
        </div>
        <div class="links">
            <a href="/orion" class="link-card">
                <div class="profile-pic" style="background: #007bff; display: flex; justify-content: center; align-items: center; color: white; font-size: 2rem;">OK</div>
                <div class="content">
                    <h2>Orion Koepke</h2>
                    <p>Technical Lead Software Engineer</p>
                </div>
            </a>
            <a href="/nicole" class="link-card">
                <img src="/assets/nicole.jpg" alt="Nicole Koepke" class="profile-pic">
                <div class="content">
                    <h2>Nicole Koepke</h2>
                    <p>Clinical Specialist & Sonographer</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
