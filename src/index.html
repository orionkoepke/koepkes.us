<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #222;
        }

        .links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-decoration: none;
            color: #333;
            min-width: 200px;
        }

        .link-card:hover {
            transform: translateY(-5px);
        }

        .link-card h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #007bff;
        }

        .link-card p {
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .links {
                gap: 1rem;
            }

            .link-card {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
    <script>
        // Get the subdomain from the hostname
        const subdomain = window.location.hostname.split('.')[0];
        
        // Map of valid subdomains to their paths
        const redirects = {
            'orion': '/orion',
            'nicole': '/nicole'
        };
        
        // If we have a matching subdomain, redirect to its path
        if (redirects[subdomain]) {
            window.location.href = redirects[subdomain];
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Welcome to Koepkes.us</h1>
        <div class="links">
            <a href="/orion" class="link-card">
                <h2>Orion Koepke</h2>
                <p>Technical Lead Software Engineer</p>
            </a>
            <a href="/nicole" class="link-card">
                <h2>Nicole Koepke</h2>
                <p>Clinical Specialist & Sonographer</p>
            </a>
        </div>
    </div>
</body>
</html>
